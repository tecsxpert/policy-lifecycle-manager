spring:
  # Cache configuration - using Redis for distributed caching with 10-minute TTL
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes in milliseconds
  
  # Database configuration - credentials must be provided via environment variables
  # Do not hardcode database secrets in this file for production environments
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  # Redis configuration - host and port should be provided via environment variables
  # Uses fallback defaults for local development (localhost:6379)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Mail credentials must be provided through environment variables.
  # Do not hardcode secrets in application.yml for production.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  # JWT secret should come from an environment variable for secure configuration.
  secret: ${JWT_SECRET}