spring:
  # =========================================================
  # Cache Configuration
  # =========================================================
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes in milliseconds

  # =========================================================
  # Database Configuration
  # =========================================================
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/policydb}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  # =========================================================
  # H2 Console (optional for local development)
  # =========================================================
  h2:
    console:
      enabled: true

  # =========================================================
  # JPA / Hibernate
  # =========================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # =========================================================
  # Flyway
  # =========================================================
  flyway:
    enabled: false

  # =========================================================
  # Redis Configuration
  # =========================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # =========================================================
  # Mail Configuration
  # =========================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =========================================================
# JWT Configuration
# =========================================================
jwt:
  secret: ${JWT_SECRET}