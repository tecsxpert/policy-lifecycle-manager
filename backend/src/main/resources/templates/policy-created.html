<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policy Created Successfully</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4a90e2, #1c60b3);
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .content {
            padding: 24px;
        }
        .content p {
            line-height: 1.7;
            margin: 16px 0;
        }
        .card {
            background-color: #f7f9fd;
            border-radius: 10px;
            padding: 18px;
            margin: 20px 0;
            border: 1px solid #e1e7f2;
        }
        .card p {
            margin: 10px 0;
        }
        .footer {
            color: #657786;
            font-size: 14px;
            padding: 0 24px 24px;
        }
        .label {
            display: block;
            font-size: 13px;
            color: #6b7a99;
            margin-bottom: 4px;
        }
        .value {
            font-size: 16px;
            color: #1f2937;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Policy Created Successfully</h1>
    </div>
    <div class="content">
        <p>Great news! Your policy has been created successfully and is now active in our system.</p>
        <div class="card">
            <p><span class="label">Policy Name</span><span class="value" th:text="${policyName}">Policy Name</span></p>
            <p><span class="label">Policy Number</span><span class="value" th:text="${policyNumber}">POL1234</span></p>
            <p><span class="label">Status</span><span class="value" th:text="${status}">ACTIVE</span></p>
        </div>
        <p>If you have any questions, our support team is ready to help.</p>
        <p class="footer">Thank you for choosing Policy Lifecycle Manager.</p>
    </div>
</div>
</body>
</html>
